<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CMGAP提字器ios</title>
    <style>
        :root {
            --harmony-scale: 1;
        }
        
        body {
            font-family: "HarmonyOS Sans", Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #222;
            color: white;
            display: flex;
            flex-direction: column;
            height: 100vh;
            touch-action: none;
            -webkit-overflow-scrolling: touch;
        }
        
        .header {
            background-color: #333;
            padding: 1px;
            text-align: center;
            flex-shrink: 0;
            height: 20px;
            overflow: hidden;
        }
        
        .header h1 {
            font-size: 16px;
            margin: 0;
            line-height: 28px;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            padding: 2px;
            background-color: #444;
            gap: 3px;
            flex-wrap: wrap;
            flex-shrink: 0;
            height: auto;
            min-height: 20px;
        }
        
        button {
            padding: 5px 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            min-width: 15px;
        }
        
        button:hover {
            background-color: #45a049;
        }
        
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        
        .control-group {
            display: flex;
            align-items: center;
            gap: 6px;
            background-color: #555;
            padding: 3px 6px;
            border-radius: 6px;
        }
        
        .teleprompter {
            flex: 1;
            overflow: hidden;
            position: relative;
            background-color: black;
            margin: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
        }
        
        .text-container {
            width: 96%;
            height: 96%;
            overflow: hidden;
            position: relative;
            display: flex;
            justify-content: center;
        }
        
        #prompter-text {
            font-size: calc(28px * var(--harmony-scale));
            line-height: 1.8;
            color: white;
            position: relative;
            width: 100%;
            text-align: center;
            transition: transform 0.1s linear;
            user-select: none;
            padding: 15px;
            box-sizing: border-box;
            font-weight: 500;
            will-change: transform;
            white-space: pre-line;
            text-indent: 2em;
            margin: 0;
        }
        
        textarea {
            width: 96%;
            min-height: 60px;
            height: auto;
            margin: 5px auto;
            display: block;
            padding: 8px;
            font-size: 32px;
            border-radius: 6px;
            border: none;
            flex-shrink: 0;
        }
        
        .mirror {
            transform: scaleX(-1);
        }
        
        #file-input {
            display: none;
        }
        
        @media screen and (max-width: 360px) {
            #prompter-text {
                font-size: calc(26px * var(--harmony-scale));
            }
            button {
                padding: 8px 12px;
                min-width: 50px;
                font-size: 28px;
            }
        }

        @media screen and (orientation: landscape) {
            .header {
                display: none;
            }
            
            .teleprompter {
                margin: 2px;
                height: calc(100vh - 60px);
                -webkit-overflow-scrolling: touch;
            }
            
            .text-container {
                width: 99%;
                height: 98% !important;
            }
            
            #prompter-text {
                font-size: calc(26px * var(--harmony-scale));
                padding: 10px;
            }
            
            .controls {
                padding: 4px;
                gap: 4px;
            }
            
            .control-group {
                padding: 4px 8px;
            }
            
            button {
                padding: 8px 10px;
                min-width: 50px;
            }
            
            textarea {
                min-height: 50px;
                height: auto;
                margin: 3px auto;
            }
            
            body {
                height: 100vh;
                overflow: hidden;
            }
        }
        
        @media screen and (max-width: 768px) {
            textarea {
                -webkit-appearance: none;
                border-radius: 6px;
                background-color: white;
                color: black;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>CMGAP提字器</h1>
    </div>
    
    <div class="controls">
        <div class="control-group">
            <button id="start-btn">开始</button>
            <button id="pause-btn" disabled>暂停</button>
            <button id="reset-btn">重置</button>
        </div>
        
        <div class="control-group">
            <label for="speed">速度:</label>
            <input type="range" id="speed" min="1" max="20" value="5">
            <span id="speed-value">5</span>
        </div>
        
        <div class="control-group">
            <label for="font-size">字体:</label>
            <input type="range" id="font-size" min="16" max="48" value="28">
            <span id="font-size-value">28px</span>
        </div>
        
        <div class="control-group">
            <button id="mirror-btn">镜像模式</button>
            <button id="open-file-btn">打开文件</button>
            <input type="file" id="file-input" accept=".txt,.text">
        </div>
    </div>
    
    <div class="teleprompter" id="teleprompter-area">
        <div class="text-container">
            <div id="prompter-text">在这里输入您的文本。点击"开始"按钮开始滚动，使用速度滑块调整滚动速度。</div>
        </div>
    </div>
    
    <textarea id="input-text" placeholder="在此输入您的提词文本..."></textarea>
    
    <script>
        // 检测iOS设备
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        
        // 鸿蒙系统检测与优化
        const isHarmonyOS = /HarmonyOS|HMOS/.test(navigator.userAgent);
        if (isHarmonyOS) {
            document.documentElement.style.setProperty('--harmony-scale', '1.1');
            console.log('鸿蒙系统优化已启用');
        }
        
        // iOS特定优化
        if (isIOS) {
            document.body.style.webkitUserSelect = 'none';
            document.body.style.webkitTouchCallout = 'none';
            
            document.addEventListener('touchmove', function(e) {
                if (e.scale !== 1) {
                    e.preventDefault();
                }
            }, { passive: false });
            
            console.log('iOS优化已启用');
        }
        
        // 获取DOM元素
        const startBtn = document.getElementById('start-btn');
        const pauseBtn = document.getElementById('pause-btn');
        const resetBtn = document.getElementById('reset-btn');
        const mirrorBtn = document.getElementById('mirror-btn');
        const openFileBtn = document.getElementById('open-file-btn');
        const fileInput = document.getElementById('file-input');
        const speedSlider = document.getElementById('speed');
        const speedValue = document.getElementById('speed-value');
        const fontSizeSlider = document.getElementById('font-size');
        const fontSizeValue = document.getElementById('font-size-value');
        const prompterText = document.getElementById('prompter-text');
        const inputText = document.getElementById('input-text');
        const textContainer = document.querySelector('.text-container');
        const teleprompterArea = document.getElementById('teleprompter-area');
        
        // 初始化变量
        let isPlaying = false;
        let animationId;
        let position = 0;
        let speed = 5;
        let fontSize = 28;
        let touchStartY = 0;
        let touchStartPosition = 0;
        let isTouchMoving = false;
        let touchCount = 0;
        let lastTouchTime = 0;
        let textHeight = 0; // 新增：存储文本高度
                
        // 自动调整初始字体大小
        function adjustInitialFontSize() {
            const screenHeight = window.innerHeight;
            if (screenHeight < 600) {
                fontSize = 26;
            } else if (screenHeight > 800) {
                fontSize = 32;
            }
            fontSizeSlider.value = fontSize;
            prompterText.style.fontSize = fontSize + 'px';
            fontSizeValue.textContent = fontSize + 'px';
        }
        
        // 更新速度显示
        speedSlider.addEventListener('input', function() {
            speed = parseInt(this.value);
            speedValue.textContent = speed;
        });
        
        // 更新字体大小
        fontSizeSlider.addEventListener('input', function() {
            fontSize = parseInt(this.value);
            fontSizeValue.textContent = fontSize + 'px';
            prompterText.style.fontSize = fontSize + 'px';
            // 字体大小改变后重新计算文本高度
            setTimeout(calculateTextHeight, 100);
        });
        
        // 计算文本实际高度（修复滚动不完整问题）
        function calculateTextHeight() {
            // 保存当前transform状态
            const currentTransform = prompterText.style.transform;
            
            // 临时移除transform以获取正确高度
            prompterText.style.transform = 'none';
            
            // 获取文本的实际高度
            textHeight = prompterText.scrollHeight;
            
            // 恢复transform
            prompterText.style.transform = currentTransform;
            
            console.log('文本高度计算完成:', textHeight, 'px');
        }
        
        // 开始滚动
        function startScrolling() {
            if (!isPlaying) {
                isPlaying = true;
                startBtn.disabled = true;
                pauseBtn.disabled = false;
                
                // 开始前重新计算文本高度
                calculateTextHeight();
                
                animate();
            }
        }
        
        // 暂停滚动
        function pauseScrolling() {
            if (isPlaying) {
                isPlaying = false;
                startBtn.disabled = false;
                pauseBtn.disabled = true;
                cancelAnimationFrame(animationId);
            }
        }
        
        startBtn.addEventListener('click', startScrolling);
        pauseBtn.addEventListener('click', pauseScrolling);
        
        // 重置位置
        resetBtn.addEventListener('click', function() {
            isPlaying = false;
            startBtn.disabled = false;
            pauseBtn.disabled = true;
            cancelAnimationFrame(animationId);
            position = 0;
            updatePosition();
        });
        
        // 镜像模式
        mirrorBtn.addEventListener('click', function() {
            prompterText.classList.toggle('mirror');
        });
        
        // 打开本地文件
        openFileBtn.addEventListener('click', function() {
            fileInput.click();
        });
        
        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            if (file.size > 10 * 1024 * 1024) {
                alert('文件太大，请选择小于10MB的文件');
                return;
            }
            
            const reader = new FileReader();
            reader.onload = function(e) {
                const content = e.target.result;
                prompterText.textContent = content;
                inputText.value = content;
                
                // 文件加载后重新计算文本高度
                setTimeout(calculateTextHeight, 100);
            };
            reader.onerror = function() {
                alert('读取文件时出错');
            };
            reader.readAsText(file);
        });
        
        // 更新文本内容
        inputText.addEventListener('input', function() {
            prompterText.textContent = this.value || "在这里输入您的文本。点击\"开始\"按钮开始滚动，使用速度滑块调整滚动速度。";
            
            // 文本更新后重新计算高度
            setTimeout(calculateTextHeight, 100);
        });
        
        // 动画函数
        function animate() {
            position += speed / 10;
            updatePosition();
            
            if (isPlaying) {
                animationId = requestAnimationFrame(animate);
            }
        }
        
        // 更新文本位置（修复滚动结束判断）
        function updatePosition() {
            const containerHeight = textContainer.clientHeight;
            
            // 使用计算得到的文本高度而不是clientHeight
            if (position > textHeight - containerHeight) {
                isPlaying = false;
                startBtn.disabled = false;
                pauseBtn.disabled = true;
                console.log('滚动完成，文本高度:', textHeight, '容器高度:', containerHeight, '最终位置:', position);
                return;
            }
            
            if (position < 0) {
                position = 0;
            }
            
            prompterText.style.transform = `translateY(-${position}px)`;
        }
        
        // 触摸事件处理
        teleprompterArea.addEventListener('touchstart', function(e) {
            const now = Date.now();
            
            if (now - lastTouchTime < 300) {
                touchCount++;
                if (touchCount === 2) {
                    if (isPlaying) {
                        pauseScrolling();
                    } else {
                        startScrolling();
                    }
                    e.preventDefault();
                    return;
                }
            } else {
                touchCount = 1;
            }
            lastTouchTime = now;
            
            if (isPlaying) {
                pauseScrolling();
            }
            
            touchStartY = e.touches[0].clientY;
            touchStartPosition = position;
            isTouchMoving = true;
            e.preventDefault();
        });
        
        teleprompterArea.addEventListener('touchmove', function(e) {
            if (!isTouchMoving) return;
            
            const touchY = e.touches[0].clientY;
            const deltaY = touchY - touchStartY;
            position = touchStartPosition - deltaY;
            
            updatePosition();
            e.preventDefault();
        });
        
        teleprompterArea.addEventListener('touchend', function(e) {
            isTouchMoving = false;
            setTimeout(() => { touchCount = 0; }, 300);
            e.preventDefault();
        });
        
        document.addEventListener('gesturestart', function(e) {
            e.preventDefault();
        });
        
        window.addEventListener('orientationchange', function() {
            setTimeout(() => {
                // 屏幕方向改变后重新计算文本高度
                calculateTextHeight();
                position = Math.min(position, textHeight - textContainer.clientHeight);
                updatePosition();
            }, 300);
        });
        
        function init() {
            adjustInitialFontSize();
            textContainer.style.height = '92%';
            
            // 初始化时计算文本高度
            setTimeout(calculateTextHeight, 500);
        }
        
        window.addEventListener('load', init);
    </script>
</body>
</html>
